name: GraphRail checks
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: npm run example:generate
      - run: cargo test --manifest-path builds/example-usdc/Cargo.toml
      - run: cargo build --manifest-path builds/example-usdc/Cargo.toml --release --target wasm32-unknown-unknown
      - name: Install official Substreams and buf CLIs
        run: |
          curl -fsSL https://github.com/streamingfast/substreams/releases/download/v1.22.0/substreams_linux_x86_64.tar.gz -o /tmp/substreams.tar.gz
          sudo tar -xzf /tmp/substreams.tar.gz -C /usr/local/bin substreams
          curl -fsSL https://github.com/bufbuild/buf/releases/download/v1.72.0/buf-Linux-x86_64 -o /tmp/buf
          sudo install -m 0755 /tmp/buf /usr/local/bin/buf
      - run: substreams pack substreams.yaml -o pipeline.spkg
        working-directory: builds/example-usdc
      - uses: actions/upload-artifact@v4
        with:
          name: example-usdc-spkg
          path: builds/example-usdc/pipeline.spkg
